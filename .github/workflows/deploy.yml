name: Flutter Web Deployment for GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify source
        run: |
          grep -n "PortfolioApp" lib/main.dart
          grep -n "Numaan Qureshi" lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter clean
          flutter pub get
          flutter build web --release --base-href "/"

      - name: Verify build
        run: |
          echo "Build completed successfully."
          echo "Build size:"
          du -sh build/web

          echo ""
          echo "Build files:"
          find build/web -maxdepth 2 -type f | sort

          echo ""
          echo "Checking required Flutter files..."

          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/main.dart.js
          test -f build/web/manifest.json

          echo "✓ Required build files exist."

          echo ""
          echo "Checking base href:"
          grep '<base href="/">' build/web/index.html

          echo ""
          echo "✓ Flutter web build is valid."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4